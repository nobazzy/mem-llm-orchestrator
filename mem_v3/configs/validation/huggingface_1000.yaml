run:
  name: validation_hf_fineweb_edu_1000
  target_global_steps: 1000
  start_lane: fast_seq256_zero0_gacc4

workload:
  dataset:
    type: huggingface
    name: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    split: train
    text_field: text
    fallback_name: roneneldan/TinyStories
    mix: ""
  tokenizer:
    name: gpt2
  model:
    preset: tiny_decoder
  runtime:
    chaos_profile: clean
    prefetch_batches: 8
    prewarm_batches: 8
    cache_mode: memmap
    cache_dir: dataset_cache
