name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pyyaml psutil requests

      - name: Run Core Suite Tests
        working-directory: ./mem_v3
        run: |
          pytest tests/test_v89_policy.py tests/test_v89_request.py tests/test_v89_profiler_memory.py
